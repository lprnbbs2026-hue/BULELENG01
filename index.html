<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Sistem pelaporan kegiatan.">
    <title>Sistem Pelaporan</title>
    <link rel="icon" type="image/x-icon" href="assets/images/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icons/apple-touch-icon.png">
    <link id="appManifest" rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0B1220">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            margin: 0;
            background: #0B1220;
            color: #E5EEF9;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px 42px;
            background: #202923;
            min-height: 100vh;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(191, 213, 241, 0.25);
            border-radius: 12px;
        }

        .top-bar h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 180px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.36);
            color: #dff9e6;
            font-weight: 700;
        }

        .header-container {
            display: block;
            margin-bottom: 10px;
        }

        .header-image-full {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .input-section {
            background: #252A2E;
            border: 1px solid #41474C;
            border-radius: 8px;
            padding: 16px;
            margin-top: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #E0EDFF;
        }

        select, input, textarea, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #BFD5F1;
            font-size: 16px;
            margin-top: 8px;
        }

        select, input, textarea {
            background: linear-gradient(180deg, #FFFFFF 0%, #EEF6FF 100%);
            color: #172033;
        }

        button {
            background: #2563EB;
            border: none;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover { background: #1D4ED8; }
        button:disabled { background: #64748B; cursor: not-allowed; }

        .media-date-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin-top: 8px;
        }

        .previewBox {
            margin-top: 12px;
            color: #C4D3E6;
            min-height: 22px;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .action-buttons button {
            flex: 1 1 180px;
        }

        .counter-container {
            margin-top: 18px;
            padding: 12px;
            background: #17263D;
            border-radius: 8px;
            text-align: center;
        }

        .counter-label {
            font-size: 14px;
            color: #BFDBFE;
        }

        .counter-value {
            font-size: 30px;
            font-weight: bold;
            color: #A9C7E8;
        }

        .sent-files-section {
            margin-top: 18px;
            padding: 12px;
            border: 1px solid #29466B;
            border-radius: 8px;
            background: #17263D;
        }

        .sent-files-section h3 {
            margin: 0 0 8px;
            color: #BFDBFE;
        }

        #logTerkirim {
            min-height: 30px;
            color: #dfe9f6;
        }

        .log-entry {
            padding: 8px 10px;
            margin-top: 6px;
            border-radius: 6px;
            background: #1A3152;
        }

        .log-status.success { color: #22C55E; }
        .log-status.failed { color: #F44336; }

        @media (max-width: 540px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .media-date-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="desaStartModal">
        <div class="desa-start-card">
            <h1 class="app-modal-title">DUKOPS BABINSA 01</h1>
            <img class="modal-logo" src="assets/images/logo/logo-1.png" alt="Lambang TNI Angkatan Darat">
            <div class="modal-logo-caption">TNI-AD</div>
            <select id="selectDesa" aria-label="Pilih desa atau kelurahan" onchange="loadSelectedDesa()">
                <option value="">Pilih Desa/Kelurahan</option>
            </select>
            <div class="start-mode-description" aria-live="polite">
                <span id="runningTextContent" class="marquee-text"></span>
            </div>
        </div>
    </div>

    <div id="thankYouModal" class="thank-you-modal" role="dialog" aria-modal="true" aria-labelledby="thankYouTitle" hidden>
        <div class="thank-you-card">
            <img class="modal-logo" src="assets/images/logo/logo-1.png" alt="Lambang TNI Angkatan Darat">
            <h2 id="thankYouTitle">Suksma</h2>
            <p id="thankYouMessage"></p>
            <button type="button" class="thank-you-button" onclick="closeThankYouModal()">OK</button>
        </div>
    </div>

    <div id="offlineModal" class="offline-modal" role="alert" aria-live="assertive" hidden>
        <div class="offline-card">
            <p>Anda sedang offline, cek jaringan koneksi internet anda</p>
        </div>
    </div>

    <div class="container">
        <div class="top-bar">
            <h2>Sistem Pelaporan Kegiatan</h2>
            <div id="selectedDesaBadge" class="badge">Belum Pilih Desa</div>
        </div>

        <div id="printable-area">
            <div class="print-header">
                <div class="header-container">
                    <img class="header-image-full" src="assets/images/header/header.png" alt="Header aplikasi">
                    <div id="headerDesaLabel" class="header-desa-label" aria-live="polite"></div>
                </div>
            </div>
            <table id="printable-table"></table>
        </div>

        <div class="input-section dashboard-desa-status">
            <div class="mode-description hidden-text"></div>
            <div class="previewBox hidden-text" id="previewDesa"></div>
            <div id="loadingKoordinat"><span class="loading-spinner" aria-hidden="true"></span>Kordinat</div>
            <button class="refresh-btn" type="button" onclick="pickRandomKoordinat()">Acak Ulang Koordinat</button>
        </div>

        <div class="input-section">
            <button id="installPwaButton" type="button">Instal Aplikasi</button>

            <div class="file-input-container">
                <input type="text" id="watermarkText" class="watermark-input" placeholder="Judul narasi kegiatan contoh: Komsos" oninput="updatePreview()">

                <div class="media-date-row">
                    <div class="image-input-group">
                        <label class="file-picker-label" for="gambar">Input<br>gambar</label>
                        <input type="file" id="gambar" accept="image/*" onchange="validateAndPreviewImage()">
                        <div id="fileValidation" class="validation-message"></div>
                    </div>

                    <div class="tanggal-input-kustom">
                        <button class="date-picker-trigger" type="button" aria-label="Pilih tanggal" onclick="openDatePicker('tanggalTanggal')">
                            <span class="date-picker-label">Tanggal</span>
                        </button>
                        <input type="date" id="tanggalTanggal" lang="id" aria-label="Pilih tanggal" onchange="syncDateTimeInputs()" oninput="syncDateTimeInputs()">
                    </div>

                    <div class="waktu-input-kustom">
                        <button class="date-picker-trigger" type="button" aria-label="Pilih waktu" onclick="openDatePicker('tanggalJam')">
                            <span class="date-picker-label">Waktu</span>
                        </button>
                        <input type="time" id="tanggalJam" step="1" lang="id" aria-label="Pilih waktu 24 jam" onchange="stopLiveSeconds(); syncDateTimeInputs()" oninput="stopLiveSeconds(); syncDateTimeInputs()">
                    </div>
                </div>

                <input type="text" id="tanggalWaktuDisplay" value="Pilih tanggal & waktu" readonly aria-label="Tanggal & waktu kegiatan">
                <input type="datetime-local" id="tanggalWaktu" step="1" lang="id" onchange="updateDatePreview()" aria-label="Tanggal & waktu gabungan">
            </div>

            <div class="previewBox" id="previewTanggal"></div>
            <canvas id="canvas"></canvas>
            <textarea id="narasi" rows="4" placeholder="Isi narasi kegiatan" oninput="autoResizeNarasi(this); checkInputCompletion()"></textarea>

            <div class="action-buttons">
                <button id="submitBtn" class="combined-button" onclick="processSubmission()" disabled>SIMPAN</button>
                <button id="exitBtn" class="exit-button" type="button" onclick="exitApplication()">KELUAR APLIKASI</button>
            </div>

            <div class="counter-container" aria-live="polite">
                <div class="counter-label">Laporan bulan dipilih</div>
                <div class="counter-value" id="successfulUploadCount">0</div>
            </div>

            <section class="sent-files-section" aria-labelledby="sentFilesTitle">
                <h3 id="sentFilesTitle">Laporan Terkirim :</h3>
                <div id="logTerkirim" aria-live="polite"></div>
            </section>
        </div>
    </div>

    <script>
        const WEBHOOK_CONFIG_URL = "data/webhook.json";
        const LOCAL_DATA_URL = "data/desa/desa dan kelurahan.json";
        let googleAppsScriptWebhook = "";
        let selectedDesa = "";
        let kordinatList = [];

        async function getGoogleAppsScriptWebhook() {
            if (googleAppsScriptWebhook) return googleAppsScriptWebhook;
            const response = await fetch(WEBHOOK_CONFIG_URL, { cache: "no-store" });
            if (!response.ok) throw new Error(`Gagal memuat konfigurasi webhook (HTTP ${response.status})`);
            const config = await response.json();
            if (typeof config.webhookUrl !== "string" || !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(config.webhookUrl)) {
                throw new Error("URL webhook belum dikonfigurasi");
            }
            googleAppsScriptWebhook = config.webhookUrl;
            return googleAppsScriptWebhook;
        }

        async function fetchWilayahList() {
            const response = await fetch(LOCAL_DATA_URL, { cache: "no-store" });
            if (!response.ok) throw new Error("Gagal memuat daftar desa/kelurahan");
            const data = await response.json();
            if (!Array.isArray(data)) throw new Error("Format daftar wilayah tidak valid");
            return data;
        }

        function populateDesaOptions() {
            const select = document.getElementById("selectDesa");
            fetchWilayahList()
                .then(items => {
                    items.forEach(item => {
                        const opt = document.createElement("option");
                        opt.value = item;
                        opt.textContent = item.replace(/\.txt$/i, "").replace(/^\s+|\s+$/g, "");
                        select.appendChild(opt);
                    });
                })
                .catch(err => {
                    console.error(err);
                    const opt = document.createElement("option");
                    opt.textContent = "Gagal memuat data desa";
                    opt.disabled = true;
                    opt.selected = true;
                    select.appendChild(opt);
                });
        }

        function updateSelectedDesaBadge() {
            const badge = document.getElementById("selectedDesaBadge");
            if (!badge) return;
            badge.textContent = selectedDesa || "Belum Pilih Desa";
            badge.style.background = selectedDesa ? "rgba(76, 175, 80, 0.15)" : "rgba(255, 152, 0, 0.15)";
            badge.style.borderColor = selectedDesa ? "rgba(76, 175, 80, 0.36)" : "rgba(255, 152, 0, 0.38)";
        }

        function loadSelectedDesa() {
            const select = document.getElementById("selectDesa");
            selectedDesa = select.value;
            updateSelectedDesaBadge();
            if (!selectedDesa) {
                document.getElementById("headerDesaLabel").textContent = "";
                return;
            }

            const label = selectedDesa.replace(/\.txt$/i, "").replace(/^\s+|\s+$/g, "");
            document.getElementById("headerDesaLabel").textContent = label;
            document.getElementById("runningTextContent").textContent = `Desa/Kelurahan aktif: ${label}`;
            renderPreview(label);
        }

        function renderPreview(label) {
            const preview = document.getElementById("previewDesa");
            preview.textContent = `Wilayah aktif: ${label}`;
        }

        function updatePreview() {
            const input = document.getElementById("watermarkText");
            const preview = document.getElementById("previewTanggal");
            preview.textContent = input.value ? `Judul: ${input.value}` : "Judul belum diisi";
        }

        function validateAndPreviewImage() {
            const fileInput = document.getElementById("gambar");
            const validationMsg = document.getElementById("fileValidation");
            if (!fileInput.files || fileInput.files.length === 0) {
                validationMsg.textContent = "Silakan pilih file gambar";
                return;
            }
            validationMsg.textContent = `File dipilih: ${fileInput.files[0].name}`;
        }

        function autoResizeNarasi(el) {
            el.style.height = "auto";
            el.style.height = (el.scrollHeight + 8) + "px";
        }

        function syncDateTimeInputs() {
            const dateVal = document.getElementById("tanggalTanggal").value;
            const timeVal = document.getElementById("tanggalJam").value;
            const display = document.getElementById("tanggalWaktuDisplay");
            if (dateVal && timeVal) {
                display.value = `${dateVal} ${timeVal}`;
                document.getElementById("tanggalWaktu").value = `${dateVal}T${timeVal}`;
            } else if (dateVal) {
                display.value = dateVal;
            } else {
                display.value = "Pilih tanggal & waktu";
            }
        }

        function updateDatePreview() {
            const value = document.getElementById("tanggalWaktu").value;
            const display = document.getElementById("tanggalWaktuDisplay");
            display.value = value ? value.replace("T", " ") : "Pilih tanggal & waktu";
        }

        function openDatePicker(id) {
            const input = document.getElementById(id);
            if (input) input.showPicker ? input.showPicker() : input.click();
        }

        function stopLiveSeconds() {}
        function pickRandomKoordinat() {}
        function checkInputCompletion() {}
        function processSubmission() {
            const log = document.getElementById("logTerkirim");
            const item = document.createElement("div");
            item.className = "log-entry";
            item.innerHTML = `<strong>${selectedDesa || "Wilayah"}</strong> <span class="log-status success">Terkirim</span>`;
            log.prepend(item);
            document.getElementById("successfulUploadCount").textContent = String(Number(document.getElementById("successfulUploadCount").textContent) + 1);
        }

        function exitApplication() {
            const modal = document.getElementById("thankYouModal");
            const message = document.getElementById("thankYouMessage");
            message.textContent = "Terima kasih, data telah disimpan untuk ditinjau kembali.";
            modal.hidden = false;
        }

        function closeThankYouModal() {
            document.getElementById("thankYouModal").hidden = true;
        }

        window.addEventListener("DOMContentLoaded", () => {
            populateDesaOptions();
            updateSelectedDesaBadge();
            updatePreview();
        });
    </script>
</body>
</html>
