    <script>
        const WEBHOOK_CONFIG_URL = "data/webhook.json";
        let googleAppsScriptWebhook = "";

        async function getGoogleAppsScriptWebhook() {
            if (googleAppsScriptWebhook) return googleAppsScriptWebhook;
            const response = await fetch(WEBHOOK_CONFIG_URL, { cache: "no-store" });
            if (!response.ok) {
                throw new Error(`Gagal memuat konfigurasi webhook (HTTP ${response.status})`);
            }
            const config = await response.json();
            if (typeof config.webhookUrl !== "string" ||
                !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(config.webhookUrl)) {
                throw new Error("URL webhook belum dikonfigurasi");
            }
            googleAppsScriptWebhook = config.webhookUrl;
            return googleAppsScriptWebhook;
        }

        async function sendToBackend(action, data = {}) {
            const allowedActions = ["uploadDrive", "getCounter", "listFiles", "repairSequence"];
            if (!allowedActions.includes(action)) {
                throw new Error(`Action "${action}" tidak tersedia`);
            }

            const formData = new FormData();
            formData.append("action", action);
            Object.keys(data).forEach(key => {
                if (data[key] !== undefined && data[key] !== null) {
                    formData.append(key, String(data[key]));
                }
            });

            const response = await fetch(await getGoogleAppsScriptWebhook(), {
                method: "POST",
                body: formData
            });
            if (!response.ok) {
                throw new Error(`Backend gagal (HTTP ${response.status})`);
            }
            return response.json();
        }

        async function getDriveUploadCounter(accountId) {
            if (typeof accountId !== "string" || !accountId.trim()) {
                throw new Error("ID akun Desa/Kelurahan tidak tersedia");
            }
            const result = await sendToBackend("getCounter", { accountId: accountId.trim() });
            if (result.success !== true || !result.counter) {
                throw new Error(result.error || "Gagal mengambil counter Google Drive");
            }
            return result.counter;
        }

        async function repairDriveReportSequence(accountId) {
            try {
                const result = await sendToBackend("repairSequence", {
                    accountId: accountId.trim()
                });
                if (result.success !== true ||
                    !Number.isSafeInteger(result.maxSequence) ||
                    result.maxSequence < 0) {
                    throw new Error(result.error || "Respons perbaikan nomor laporan tidak valid");
                }

                if (activeAccountId === accountId) {
                    successfulSequence = result.maxSequence;
                    localStorage.setItem(
                        getAccountStorageKey("successfulSequence", accountId),
                        String(successfulSequence)
                    );
                    await Promise.all([
                        syncDriveUploadCounter(accountId),
                        syncDriveReports(accountId)
                    ]);
                }
                return true;
            } catch (error) {
                console.error("Gagal memperbaiki nomor urut laporan:", error);
                showNotification(
                    "Gagal memperbaiki nomor urut laporan. Perbarui deployment Google Apps Script.",
                    "error"
                );
                return false;
            }
        }

        async function getDriveReports(accountId, monthFilter) {
            if (typeof accountId !== "string" || !accountId.trim()) {
                throw new Error("ID akun Desa/Kelurahan tidak tersedia");
            }
            const result = await sendToBackend("listFiles", {
                desaFilter: accountId.trim(),
                monthFilter
            });
            if (result.success !== true || !Array.isArray(result.files)) {
                throw new Error(result.error || "Gagal mengambil daftar laporan Google Drive");
            }
            return result.files.filter(file =>
                file && typeof file.name === "string" && /\.zip$/i.test(file.name) &&
                (file.month || getReportMonthFromFilename(file.name)) === monthFilter
            );
        }

        function getReportMonthFromFilename(filename) {
            const match = filename.match(/_(\d{2})-(\d{2})-(\d{4})\.zip$/i);
            return match ? `${match[3]}-${match[2]}` : "";
        }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const result = reader.result;
                    if (typeof result !== "string") {
                        reject(new Error("Gagal membaca file laporan"));
                        return;
                    }
                    resolve(result.split(",")[1]);
                };
                reader.onerror = () => reject(new Error("Gagal membaca file laporan"));
                reader.readAsDataURL(blob);
            });
        }

        async function uploadToGoogleDrive(zipBlob, zipFileName, desaName, date) {
            if (!(date instanceof Date) || Number.isNaN(date.getTime())) {
                throw new Error("Tanggal upload tidak valid");
            }
            if (typeof desaName !== "string" || !desaName.trim()) {
                throw new Error("ID akun Desa/Kelurahan tidak tersedia");
            }

            const accountId = desaName.trim();
            const regionType = /^kelurahan\b/i.test(accountId) ? "Kelurahan" : "Desa";
            const month = date.toLocaleDateString("id-ID", { month: "long" });
            const year = String(date.getFullYear());
            const dateParts = new Intl.DateTimeFormat("en-CA", {
                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }).formatToParts(date);
            const dateValues = Object.fromEntries(dateParts
                .filter(part => part.type !== "literal")
                .map(part => [part.type, part.value]));
            const counterDateKey = `${dateValues.year}-${dateValues.month}-${dateValues.day}`;
            const result = await sendToBackend("uploadDrive", {
                accountId,
                counterDateKey,
                fileName: zipFileName,
                zipFileName,
                desaName: accountId,
                wilayah: accountId,
                regionType,
                folderName: accountId,
                fileData: await blobToBase64(zipBlob),
                year,
                month,
                folderPath: `${regionType}/${accountId}/${year}/${month}`,
                desa: accountId,
                mimeType: "application/zip"
            });
            if (result.duplicate === true) {
                return {
                    success: false,
                    duplicate: true,
                    error: result.error || "Laporan untuk tanggal ini sudah pernah dikirim."
                };
            }
            if (result.success !== true) {
                throw new Error(result.error || "Upload ke Google Drive gagal");
            }
            return { success: true, counter: result.counter };
        }

        window.sendToBackend = sendToBackend;
        window.uploadToGoogleDrive = uploadToGoogleDrive;

        const DEVICE_TIME_ZONE = Intl.DateTimeFormat().resolvedOptions().timeZone;

        function getDeviceZoneLabel(date = new Date()) {
            const offsetMinutes = -date.getTimezoneOffset();
            if (offsetMinutes === 420) return "WIB";
            if (offsetMinutes === 480) return "WITA";
            if (offsetMinutes === 540) return "WIT";
            return DEVICE_TIME_ZONE || "Waktu perangkat";
        }

        function getIndonesiaDateParts(date = new Date()) {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: DEVICE_TIME_ZONE,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hourCycle: 'h23'
            }).formatToParts(date);
            return Object.fromEntries(parts
                .filter(part => part.type !== 'literal')
                .map(part => [part.type, part.value]));
        }

        function formatIndonesiaDate(date, options) {
            return date.toLocaleString('id-ID', {
                timeZone: DEVICE_TIME_ZONE,
                ...options
            });
        }

        function parseIndonesiaInput(value) {
            return new Date(value);
        }

            const ticker = document.getElementById("storedFileTicker");
            if (!ticker) return;
            ticker.innerHTML = `<span>ZIP tersimpan di Google Drive: ${fileName}</span>`;

        }
        
        // ================= VARIABEL CHAT HYBRID =================
        let lastUpdateId = 0;
        let chatConnectionActive = false;
        let unreadMessages = 0;
        let chatHistory = [];
        let ignoredMessageIds = new Set();

        const POLL_INTERVAL = 3000;

        // ================= FUNGSI UTAMA CHAT =================
        
        function updateChatDesaBadge() {
            const badge = document.getElementById('currentDesaBadge');
            const userBadge = document.getElementById('userDesaBadge');
            if (!badge || !userBadge) return;
            
            if (selectedDesa) {

                userBadge.textContent = 'Belum Pilih Desa';
                userBadge.style.background = '#315A8A';
            }
        }

        async function syncDriveReports(accountId) {
            try {
                const month = getSelectedReportMonth();
                const reports = await getDriveReports(accountId, month);
                if (activeAccountId === accountId && getSelectedReportMonth() === month) {
                    renderSendLogs(reports.map(file => ({
                        filename: file.name,
                        month: file.month,
                        status: "success",
                        time: file.createdTime && !Number.isNaN(Date.parse(file.createdTime))
                            ? new Date(file.createdTime).toLocaleString("id-ID", {
                                dateStyle: "medium",
                                timeStyle: "short"
                            })
                            : ""
                    })));
                }
            } catch (error) {
                console.error("Gagal menyinkronkan daftar laporan Google Drive:", error);
            }
        }

        function setChatMode(mode) {
            chatMode = mode;
            
            document.querySelectorAll('.chat-option-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            const activeBtn = document.getElementById(mode + 'ModeBtn');
            if (activeBtn) activeBtn.classList.add('active');
            
            let modeText = '';
            switch(mode) {
                case 'bot':
                    modeText = 'Mengirim ke Bot Asisten saja';
                    break;
            }
            
            addChatMessage({
                type: 'system',
                text: `Ã°Å¸â€œÂ¡ Mode chat: ${modeText}`,
                timestamp: new Date().toISOString()
            });
            
            localStorage.setItem('dukops_chat_mode', mode);
        }
        
        function initChatSystem() {
            console.log('Ã°Å¸â€™Â¬ Initializing hybrid chat system...');
            
            const savedMode = localStorage.getItem('dukops_chat_mode');
            if (savedMode) {
                setChatMode('bot');
            } else {
                setChatMode('bot');
            }
            
            updateChatDesaBadge();
            loadChatHistory();
            setupChatEvents();
            setupChatInputAutoFocus();
            setTimeout(cleanAutoReplyFromHistory, 1000);
        }
        
        function setupChatEvents() {
            document.getElementById('chatToggleBtn').onclick = toggleChatWidget;
            document.getElementById('closeChat').onclick = toggleChatWidget;
            
            const chatInput = document.getElementById('chatInput');
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendChatMessage();
                }
            });
        }
        
        function setupChatInputAutoFocus() {
            const chatToggleBtn = document.getElementById('chatToggleBtn');
            const chatWidget = document.getElementById('telegramChatWidget');
            const chatInput = document.getElementById('chatInput');
            
            chatToggleBtn.addEventListener('click', function() {
                setTimeout(() => {
                    if (chatWidget.style.display === 'flex') {
                        chatInput.focus();
                        unreadMessages = 0;
                        updateUnreadCounter();
                    }
                }, 200);
            });
        }
        
        function toggleChatWidget() {
            const widget = document.getElementById('telegramChatWidget');
            const toggleBtn = document.getElementById('chatToggleBtn');
            
            if (widget.style.display === 'flex') {
                widget.style.display = 'none';
                renderChatToggleButton(toggleBtn, false);
                if (unreadMessages > 0) {
                    toggleBtn.querySelector('.badge').style.display = 'flex';
                }
            } else {
                widget.style.display = 'flex';
                renderChatToggleButton(toggleBtn, true);
                
                unreadMessages = 0;
                updateUnreadCounter();
                
                setTimeout(() => {
                    const messagesContainer = document.getElementById('chatMessages');
                    if (messagesContainer.children.length > 0) {
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }
                }, 100);
                
                setTimeout(() => {
                    document.getElementById('chatInput').focus();
                }, 150);
            }
        }

        function renderChatToggleButton(toggleBtn, isOpen) {
            toggleBtn.textContent = isOpen ? 'TUTUP' : 'CHAT';
            if (!isOpen && unreadMessages > 0) {
                const badge = document.createElement('span');
                badge.className = 'badge';
                badge.id = 'unreadCount';
                badge.textContent = unreadMessages > 9 ? '9+' : String(unreadMessages);
                toggleBtn.appendChild(badge);
            }
        }
        
        function startTelegramPolling() {
            chatConnectionActive = true;
            
            pollTelegramMessages();
            
            const pollInterval = setInterval(() => {
                if (chatConnectionActive) {
                    pollTelegramMessages();
                } else {
                    clearInterval(pollInterval);
                }
            }, POLL_INTERVAL);
        }
        
        async function pollTelegramMessages() {
            try {
                const response = await fetch(
                    `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=2`
                );
                
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.ok && data.result.length > 0) {
                        lastUpdateId = data.result[data.result.length - 1].update_id;
                        
                        data.result.forEach(update => {
                            if (update.message && update.message.text) {
                                const msg = update.message;
                                const msgId = msg.message_id;
                                const msgText = msg.text;
                                const senderName = msg.from?.first_name || '';
                                const senderId = msg.from?.id;
                                
                                if (ignoredMessageIds.has(msgId)) return;
                                
                                const isAutoReply = 
                                    msgText.includes('BOT INPUT BABINSA') ||
                                    msgText.includes('Terima kasih. Silakan isi form') ||
                                    msgText.includes('Noted. Untuk bantuan ketik') ||
                                    msgText.includes('Pesan tercatat. Lanjutkan') ||
                                    msgText.includes('Dapat pesan dari') ||
                                    msgText.includes('Pesan diterima. Form DUKOPS aktif') ||
                                    msgText.includes('Terima kasih pesannya') ||
                                    /^BOT INPUT/.test(msgText) ||
                                    /^Terima kasih\./.test(msgText) ||
                                    /^Noted\./.test(msgText);
                                
                                const isFromBot = msg.from?.is_bot || senderName.includes('BOT');
                                
                                if (isAutoReply || isFromBot) {
                                    ignoredMessageIds.add(msgId);
                                    console.log('Ã°Å¸â€â€¡ Ignored auto-reply');
                                    return;
                                }
                                
                                processIncomingMessage(msg);
                            }
                        });
                        
                        updateChatStatus('connected');
                        updateChannelStatus(true);
                    }
                }
            } catch (error) {
                updateChatStatus('disconnected');
                updateChannelStatus(false);
            }
        }
        
        function cleanAutoReplyFromHistory() {
            const messages = document.querySelectorAll('#chatMessages .chat-message');
            messages.forEach(msg => {
                const textEl = msg.querySelector('.message-text');
                if (textEl) {
                    const text = textEl.textContent;
                    if (text.includes('BOT INPUT') || 
                        text.includes('Terima kasih. Silakan') ||
                        text.includes('Noted. Untuk bantuan')) {
                        msg.remove();
                    }
                }
            });
        }
        
        function processIncomingMessage(message) {
            if (message.from.is_bot) return;
            
            const messageText = message.text;
            const senderName = message.from.first_name || 'User';
            const senderId = message.from.id;
            const chatId = message.chat.id;
            
            let senderDisplay = senderName;
            
            addChatMessage({
                type: 'incoming',
                text: messageText,
                sender: senderDisplay,
                timestamp: new Date(message.date * 1000).toISOString()
            });
            
            if (document.getElementById('telegramChatWidget').style.display !== 'flex') {
                unreadMessages++;
                updateUnreadCounter();
            }
            
            if (senderId == TELEGRAM_CHAT_ID) {
                handleIncomingCommand(messageText, senderName, chatId);
            }
            
            saveChatHistory();
        }
        
        function handleIncomingCommand(message, sender, chatId) {
            const lowerMsg = message.toLowerCase().trim();
            
            if (lowerMsg === 'reset' && chatId == TELEGRAM_CHAT_ID) {
                resetForm();
                sendTelegramReply(chatId, 'Ã¢Å“â€¦ Form telah direset.');
            }
            
            if (lowerMsg === 'status') {
                sendTelegramReply(chatId, `Ã°Å¸â€œÅ  Status Form: ${getFormStatus()}\nÃ°Å¸â€œË† Total: ${submissionCount} laporan`);
            }
        }
        
        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if (!input || !input.value.trim()) return;
            
            const message = input.value.trim();
            const timestamp = new Date().toISOString();

        function addChatMessage(messageData) {

            if (!messagesContainer) return;
            
            const messageElement = document.createElement('div');
            
            let messageClass = '';
            switch(messageData.type) {
                case 'outgoing': messageClass = 'message-outgoing'; break;
                case 'incoming': messageClass = 'message-incoming'; break;
                case 'system': messageClass = 'message-system'; break;
                case 'error': messageClass = 'message-error'; break;
                case 'info': messageClass = 'message-info'; break;
            }
            
            const time = new Date(messageData.timestamp).toLocaleTimeString('id-ID', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            let senderHtml = '';
            if (messageData.sender) {
                if (messageData.type === 'outgoing' && selectedDesa) {
                    senderHtml = `<div class="message-sender">
                        ${messageData.sender}
                        <span class="sender-badge">${selectedDesa}</span>
                    </div>`;
                } else {
                    senderHtml = `<div class="message-sender">${messageData.sender}</div>`;
                }
            }
            
            messageElement.className = `chat-message ${messageClass}`;
            messageElement.innerHTML = `
                ${senderHtml}
                <div class="message-text">${messageData.text}</div>
                <div class="message-time">${time}</div>
            `;
            
            messagesContainer.appendChild(messageElement);
            
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 50);
            
            chatHistory.push({
                ...messageData,
                id: Date.now()
            });
            
            if (chatHistory.length > MAX_CHAT_HISTORY) {
                chatHistory = chatHistory.slice(-MAX_CHAT_HISTORY);

        function validateAndPreviewImage() {
            const fileInput = document.getElementById("gambar");
            const validationMsg = document.getElementById("fileValidation");
            
            validationMsg.className = "validation-message";
            validationMsg.textContent = "";
            fileIsValid = false;
            document.getElementById("canvas").style.display = "none";
            img = new Image();
            
            if (!fileInput.files || fileInput.files.length === 0) {
                validationMsg.className = "validation-message validation-warning";
                validationMsg.textContent = "Ã¢Å¡Â Ã¯Â¸Â Silakan pilih file gambar";
                return;
            }
            
            currentFile = fileInput.files[0];
            
            if (!ALLOWED_TYPES.includes(currentFile.type)) {
                validationMsg.className = "validation-message validation-error";
                validationMsg.textContent = `Ã¢ÂÅ’ Format file tidak didukung. Gunakan: JPEG, PNG, GIF, WebP`;
                fileInput.value = "";
                return;
            }
            
            if (currentFile.size > MAX_FILE_SIZE) {
                validationMsg.className = "validation-message validation-error";
                validationMsg.textContent = `Ã¢ÂÅ’ File terlalu besar (${formatFileSize(currentFile.size)}). Maksimal: ${formatFileSize(MAX_FILE_SIZE)}`;
                fileInput.value = "";
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                img = new Image();
                img.src = e.target.result;
                
                img.onload = function() {
                    const width = img.naturalWidth || img.width;
                    const height = img.naturalHeight || img.height;

                    if (width <= height) {
                        validationMsg.className = "validation-message validation-error";
                        validationMsg.textContent = "Gambar harus berorientasi landscape (lebar harus lebih besar dari tinggi).";
                        fileInput.value = "";
                        currentFile = null;
                        fileIsValid = false;
                        img = new Image();
                        document.getElementById("canvas").style.display = "none";
                        updatePreview();
                        checkInputCompletion();
                        return;
                    }
                    
                    let validationStatus = "";
                    let statusClass = "";
                    
                    if (width < MIN_WIDTH || height < MIN_HEIGHT) {
                        validationStatus = `Ã¢Å¡Â Ã¯Â¸Â Resolusi rendah (min: ${MIN_WIDTH}Ãƒâ€”${MIN_HEIGHT})`;
                        statusClass = "validation-warning";
                        fileIsValid = false;
                        document.getElementById("canvas").style.display = "none";
                    } else {
                        validationStatus = "Ã¢Å“â€¦ Resolusi memadai";
                        statusClass = "validation-success";
                        fileIsValid = true;
                        document.getElementById("canvas").style.display = "block";
                    }
                    
                    validationMsg.className = `validation-message ${statusClass}`;
                    validationMsg.innerHTML = `
                        ${validationStatus}<br>
                        <small>Rasio: ${(width/height).toFixed(2)}:1 | Format: ${currentFile.type.split('/')[1].toUpperCase()}</small>
                    `;
                    
                    if (kordinatList.length > 0) {
                        pickRandomKoordinat();
                    }
                    
                    updatePreview();
                    checkInputCompletion();
                };
                
                img.onerror = function() {
                    document.getElementById("canvas").style.display = "none";
                    validationMsg.className = "validation-message validation-error";
                    validationMsg.textContent = "Gagal memuat gambar. File mungkin rusak.";
                    fileInput.value = "";
                    fileIsValid = false;
                };
            };
            
            reader.readAsDataURL(currentFile);
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function updatePreview() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            const watermarkInput = document.getElementById("watermarkText");
            const canvasWidth = 800;
            const canvasHeight = 600;

            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (img.src && img.complete) {
                const imageRatio = img.width / img.height;
                const canvasRatio = canvasWidth / canvasHeight;
                let sourceWidth = img.width;
                let sourceHeight = img.height;
                let sourceX = 0;
                let sourceY = 0;

                if (imageRatio > canvasRatio) {
                    sourceWidth = img.height * canvasRatio;
                    sourceX = (img.width - sourceWidth) / 2;
                } else {
                    sourceHeight = img.width / canvasRatio;
                    sourceY = (img.height - sourceHeight) / 2;
                }

                ctx.drawImage(
                    img,
                    sourceX,
                    sourceY,
                    sourceWidth,
                    sourceHeight,
                    0,
                    0,
                    canvasWidth,
                    canvasHeight
                );
            } else {
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            const customWatermark = watermarkInput ? watermarkInput.value.trim() : "";
            const isIdentityWatermark = /^(?:Babinsa|Desa|Kelurahan)\b/i.test(customWatermark);
            const watermarkText = customWatermark
                ? (isIdentityWatermark ? formatBabinsaIdentity(customWatermark) : customWatermark)
                : formatBabinsaIdentity(selectedDesa);

            if (watermarkText || currentKoordinat || tanggalWaktu) {
                ctx.textAlign = "right";
                ctx.font = "36px Arial";
                ctx.fillStyle = "white";
                ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
                ctx.lineWidth = 4;
                ctx.lineJoin = "round";
                
                const bottomMargin = 20;
                const lineHeight = 40;
                const rightMargin = 10;
                
                if (watermarkText) {
                    ctx.strokeText(watermarkText,
                                  canvas.width - rightMargin, 
                                  canvas.height - bottomMargin - (lineHeight * 2));
                    
                    ctx.fillStyle = "white";
                    ctx.fillText(watermarkText,
                                canvas.width - rightMargin, 
                                canvas.height - bottomMargin - (lineHeight * 2));
                }
                
                if (currentKoordinat) {
                    ctx.strokeText(currentKoordinat, 
                                  canvas.width - rightMargin, 
                                  canvas.height - bottomMargin - lineHeight);
                    
                    ctx.fillStyle = "white";
                    ctx.fillText(currentKoordinat, 
                                canvas.width - rightMargin, 
                                canvas.height - bottomMargin - lineHeight);
                }
                
                if (tanggalWaktu) {
                    const date = new Date(tanggalWaktu);
                    let dateText;
                    
                    if (date.toLocaleDateString) {
                        const watermarkSeconds = String(date.getSeconds()).padStart(2, "0");
                        dateText = formatIndonesiaDate(date, { 
                            day: "2-digit", 
                            month: "long", 
                            year: "numeric" 
                        }) + ", " + 
                        formatIndonesiaDate(date, { 
                            hour: "2-digit", 
                            minute: "2-digit", 
                            hour12: false,
                            hourCycle: "h23"
                        }).replace(":", ".") + `.${watermarkSeconds}`;
                    }
                    
                    ctx.strokeText(dateText, 
                                  canvas.width - rightMargin, 
                                  canvas.height - bottomMargin);
                    
                    ctx.fillStyle = "white";
                    ctx.fillText(dateText, 
                                canvas.width - rightMargin, 
                                canvas.height - bottomMargin);
                }
            }
        }

        function canvasToBlob(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(new Error("Gagal membuat gambar laporan"));
                    }
                }, "image/png");
            });
        }

        function downloadBlob(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function createSubmissionZip(submission) {
            if (typeof JSZip === "undefined") {
                throw new Error("Modul ZIP belum tersedia. Periksa koneksi lalu muat ulang halaman.");
            }

            const zip = new JSZip();
            zip.file(`${submission.baseName}.png`, submission.imageBlob);
            zip.file(`${submission.baseName}.txt`, submission.reportText);
            const zipBlob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
            return { zipBlob, baseName: submission.baseName };
        }

        async function processSubmission() {
            const submitButton = document.getElementById("submitBtn");
            if (submitButton.dataset.processing === "true") return;
            if (!selectedDesa || !currentKoordinat || !fileIsValid || !tanggalWaktu) {
                checkInputCompletion();
                return;
            }

            if (isDuplicateSubmission()) {
                showNotification(`Laporan sudah dikirim pada tanggal yang sama: ${formatSubmissionDate(tanggalWaktu)}. Pengiriman dibatalkan.`, "duplicate");
                return;
            }

            submitButton.dataset.processing = "true";
            submitButton.disabled = true;
            submitButton.classList.add("is-processing");
            const originalButtonText = submitButton.innerHTML;
            submitButton.textContent = `Memproses... ${selectedDesa}`;
            try {
                const sequenceReady = await driveSequenceRepairPromise;
                if (!sequenceReady) {
                    throw new Error("Penomoran laporan belum dapat diperbaiki. Coba lagi setelah Apps Script diperbarui.");
                }
                const counter = await window.getDriveUploadCounter(selectedDesa);
                if (activeAccountId !== selectedDesa) {
                    throw new Error("Desa/Kelurahan berubah saat menyiapkan laporan");
                }
                applyDriveUploadCounter(counter);
                const files = await createSubmissionFiles();
                await downloadSubmissionFiles(files);
                let driveUploaded = false;
                let driveCounter = null;
                let uploadResult = null;
                let uploadErrorMessage = "Google Drive tidak mengonfirmasi keberhasilan upload.";
                try {
                    const submission = await createSubmissionZip(files);
                    // ZIP TIDAK diunduh ke lokal — hanya diunggah ke Google Drive.
                    uploadResult = await window.uploadToGoogleDrive(
                        submission.zipBlob,
                        `${submission.baseName}.zip`,
                        selectedDesa,
                        new Date(tanggalWaktu)
                    );
                    driveUploaded = uploadResult === true || Boolean(uploadResult && uploadResult.success === true);
                    const uploadedFileName = uploadResult && typeof uploadResult.fileName === "string"
                        ? uploadResult.fileName
                        : `${submission.baseName}.zip`;
                    if (uploadResult && uploadResult.duplicate === true) {
                        uploadErrorMessage = uploadResult.error || "Laporan untuk tanggal ini sudah pernah dikirim.";
                    }
                    driveCounter = uploadResult && typeof uploadResult === "object"
                        ? uploadResult.counter
                        : null;
                    if (driveUploaded) {
                        updateStoredFileTicker(uploadedFileName);
                        if (uploadResult.sequenceRepairSuccess === false) {
                            console.error("Penomoran setelah upload gagal:", uploadResult.sequenceRepairError);
                            showNotification(
                                "Laporan berhasil diunggah, tetapi nomor urut belum dapat diperbaiki. Pilih desa lagi atau hubungi admin.",
                                "warning",
                                true,
                                5000
                            );
                        }
                    } else {
                        console.error(uploadErrorMessage);
                    }
                } catch (uploadError) {
                    console.error("Upload Google Drive gagal:", uploadError);
                    uploadErrorMessage = uploadError.message;
                }
                if (driveUploaded) {
                    updateCounter();
                    recordSuccessfulUpload(driveCounter, files.baseName);
                    saveSubmittedDate(tanggalWaktu);
                    const finalFileName = uploadResult && typeof uploadResult.fileName === "string"
                        ? uploadResult.fileName
                        : `${files.baseName}.zip`;
                    addSendLog(finalFileName);
                    submittedBabinsas.push({ desa: selectedDesa, date: tanggalWaktu });
                    const reportMonth = getSelectedReportMonth();
                    newlyCreatedReportsByAccount[selectedDesa] ??= {};
                    newlyCreatedReportsByAccount[selectedDesa][reportMonth] =
                        (newlyCreatedReportsByAccount[selectedDesa][reportMonth] || 0) + 1;
                    await syncDriveReports(selectedDesa);
                } else {
                    if (uploadResult?.duplicate === true) {
                        showNotification(uploadErrorMessage, "duplicate");
                    } else {
                        console.warn("File laporan berhasil dibuat, tetapi upload ke Google Drive gagal:", uploadErrorMessage);
                    }
                }
            } catch (error) {
                console.error("Gagal membuat file laporan:", error);
                showNotification(error.message || "Gagal menyiapkan laporan.", "error");
            } finally {
                submitButton.disabled = false;
                submitButton.dataset.processing = "false";
                submitButton.classList.remove("is-processing");
                submitButton.innerHTML = originalButtonText;
                checkInputCompletion();
            }
        }

        async function loadAppConfig() {
            let response;
            try {
                response = await fetch(APP_CONFIG_URL, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

            } catch (error) {
                if (window.location.protocol !== "file:") {
                    throw error;
                }
                const localUrl = new URL(APP_CONFIG_URL, window.location.href).href;
                response = await fetch(localUrl, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`Gagal memuat konfigurasi aplikasi (HTTP ${response.status})`);
                }
            }

            const config = await response.json();
            const appName = typeof config.appName === "string" ? config.appName.trim() : "";
            const headerTitle = typeof config.headerTitle === "string" && config.headerTitle.trim()
                ? config.headerTitle.trim()
                : appName;
            const fields = [
                ["headerTitle", headerTitle],
                ["headerUnit", config.headerUnit],
                ["headerAddress", config.headerAddress ?? ""]
            ];
            fields.forEach(([id, value]) => {
                const text = typeof value === "string" ? value.trim() : "";
                if ((id === "headerTitle" || id === "headerUnit") && !text) {
                    throw new Error(`Konfigurasi ${id} tidak valid`);
                }
                const element = document.getElementById(id);
                if (element) {
                    element.textContent = text;
                }
            });
            document.title = `${appName || headerTitle} - Sistem Pelaporan`;
            document.querySelector('meta[name="description"]')?.setAttribute(
                "content",
                config.description || "Sistem pelaporan kegiatan."
            );
        }

        function showNotification(message, type, plain = false, autoDismissMs = 0) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}${plain ? ' notification-plain coordinate-notification' : ''}`;
            notification.textContent = message;
            notification.dataset.message = message;
            notification.setAttribute('role', 'button');
            notification.setAttribute('tabindex', '0');
            notification.setAttribute('aria-label', 'Tutup notifikasi');

            if (plain) {
                const logo = document.querySelector('#desaStartModal .modal-logo');
                if (logo) {
                    const logoBounds = logo.getBoundingClientRect();
                    notification.style.left = `${logoBounds.left + logoBounds.width / 2}px`;
                    notification.style.top = `${logoBounds.top + logoBounds.height / 2}px`;
                    notification.coordinateLogo = logo;
                    scheduleCoordinateLogoReveal(logo, autoDismissMs);
                }
            }

            document.body.appendChild(notification);

            const closeNotification = () => {
                if (notification.dismissTimer) {
                    clearTimeout(notification.dismissTimer);
                    notification.dismissTimer = null;
                }
                if (notification.coordinateLogo &&
                    notification.coordinateLogo.classList.contains('coordinate-logo-hidden')) {
                    revealCoordinateLogo(notification.coordinateLogo);
                }
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 500);
            };
            notification.addEventListener('click', closeNotification, { once: true });
            notification.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    closeNotification();
                }
            }, { once: true });
            if (autoDismissMs > 0) {
                notification.dismissTimer = setTimeout(closeNotification, autoDismissMs);
            }
        }

        function getAccountStorageKey(key, accountId = selectedDesa) {
            if (!accountId) throw new Error("Pilih Desa/Kelurahan sebelum mengakses data akun");
            return `dukopsAccountData:${encodeURIComponent(accountId)}:${key}`;

        function initializeAccountData(accountId) {
            if (!accountId || activeAccountId === accountId) return;
            activeAccountId = accountId;

            const countKey = getAccountStorageKey('submissionCount');
            const savedCount = localStorage.getItem(countKey);
            submissionCount = savedCount === null ? 0 : parseInt(savedCount, 10);
            if (savedCount === null) {
                localStorage.setItem(countKey, '0');
            }

            const uploadsKey = getAccountStorageKey('successfulUploadsByDate');
            const savedUploads = localStorage.getItem(uploadsKey);
            successfulUploadsByDate = savedUploads ? JSON.parse(savedUploads) : {};
            const derivedTotal = Object.values(successfulUploadsByDate)
                .filter(count => Number.isInteger(count) && count > 0)
                .reduce((total, count) => total + count, 0);
            const totalKey = getAccountStorageKey('successfulUploadTotal');
            const savedTotal = localStorage.getItem(totalKey);
            const cachedTotal = savedTotal === null ? NaN : Number(savedTotal);
            successfulUploadTotal = Number.isSafeInteger(cachedTotal) && cachedTotal >= 0
                ? cachedTotal
                : derivedTotal;
            if (savedTotal === null || successfulUploadTotal !== cachedTotal) {
                localStorage.setItem(totalKey, String(successfulUploadTotal));
            }
            if (savedUploads === null) {
                localStorage.setItem(uploadsKey, JSON.stringify(successfulUploadsByDate));
            }

            const sequenceKey = getAccountStorageKey('successfulSequence');
            const savedSequenceValue = localStorage.getItem(sequenceKey);
            const savedSequence = savedSequenceValue === null ? NaN : Number(savedSequenceValue);
            const previousSequences = JSON.parse(
                localStorage.getItem(getAccountStorageKey('successfulSequenceByDate')) || '{}'
            );
            const previousMaximum = Object.values(previousSequences)
                .filter(Number.isSafeInteger)
                .reduce((maximum, sequence) => Math.max(maximum, sequence), 0);
            const savedLogs = JSON.parse(localStorage.getItem(getAccountStorageKey('sendLogs')) || '[]');
            const loggedMaximum = savedLogs.reduce((maximum, log) => {
                if (log.status !== "success" || typeof log.filename !== "string") return maximum;
                const match = log.filename.match(/^(\d+)_.*_(\d{2})-(\d{2})-(\d{4})\.zip$/i);
                return match ? Math.max(maximum, Number(match[1])) : maximum;
            }, 0);
            successfulSequence = Number.isSafeInteger(savedSequence) && savedSequence >= 0
                ? savedSequence
                : Math.max(previousMaximum, loggedMaximum, successfulUploadTotal);
            localStorage.setItem(sequenceKey, String(successfulSequence));
            loadLastSubmittedDates();
            const logsContainer = document.getElementById("logTerkirim");
            if (logsContainer) logsContainer.innerHTML = '';
            renderSuccessfulUploadCounter();
            loadSendLogs();
        }

        function applyDriveUploadCounter(counter) {
            if (!counter || !Number.isInteger(counter.total) || counter.total < 0 ||
                !counter.dailyCounts || typeof counter.dailyCounts !== "object") {
                throw new Error("Counter dari Google Drive tidak valid");
            }

            successfulUploadsByDate = Object.fromEntries(
                Object.entries(counter.dailyCounts)
                    .filter(([date, count]) =>
                        /^\d{4}-\d{2}-\d{2}$/.test(date) &&
                        Number.isInteger(count) &&
                        count >= 0)
            );
            successfulUploadTotal = counter.total;
            const counterSequence = Number.isSafeInteger(counter.maxSequence) && counter.maxSequence >= 0
                ? counter.maxSequence
                : counter.total;
            successfulSequence = counterSequence;
            localStorage.setItem(
                getAccountStorageKey('successfulUploadsByDate'),
                JSON.stringify(successfulUploadsByDate)
            );
            localStorage.setItem(
                getAccountStorageKey('successfulUploadTotal'),
                String(successfulUploadTotal)
            );
            localStorage.setItem(
                getAccountStorageKey('successfulSequence'),
                String(successfulSequence)
            );
            renderSuccessfulUploadCounter();
        }

        function renderSendLogs(driveReports = null) {

            const logs = (driveReports || JSON.parse(localStorage.getItem(getAccountStorageKey('sendLogs')) || '[]'))

                    typeof log.filename === "string" &&
                    /\.zip$/i.test(log.filename) &&
                    (log.month || getReportMonthFromFilename(log.filename)) === selectedMonth)
                .sort((logA, logB) => {
                    const matchA = logA.filename.match(/^(\d+)_.*_(\d{2})-(\d{2})-(\d{4})\.zip$/i);
                    const matchB = logB.filename.match(/^(\d+)_.*_(\d{2})-(\d{2})-(\d{4})\.zip$/i);
                    const dateA = matchA ? `${matchA[4]}-${matchA[3]}-${matchA[2]}` : "";
                    const dateB = matchB ? `${matchB[4]}-${matchB[3]}-${matchB[2]}` : "";
                    if (dateA !== dateB) return dateB.localeCompare(dateA);
                    return Number(matchA?.[1] || 0) - Number(matchB?.[1] || 0);
                });
            container.replaceChildren();

            if (logs.length === 0) {

                container.appendChild(logEntry);

        function getSubmissionDateKey(dateStr) {
            const value = String(dateStr || "");
            return value.includes("T") ? value.split("T")[0] : value;
        }

        function formatSubmissionDate(dateStr) {
            const dateKey = getSubmissionDateKey(dateStr);
            const parts = dateKey.split("-");
            if (parts.length !== 3) return dateKey;
            return new Date(`${dateKey}T00:00:00`).toLocaleDateString("id-ID", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });
        }

        function isDuplicateSubmission() {
            const currentDateKey = getSubmissionDateKey(tanggalWaktu);
            return submittedDates.some(entry => {
                if (!entry || typeof entry !== "object" || !entry.desa || !entry.date) return false;
                const savedDateKey = entry.dateKey || getSubmissionDateKey(entry.date);
                return entry.desa === selectedDesa && savedDateKey === currentDateKey;
            });
        }

        function loadLastSubmittedDates() {
            const storageKey = getAccountStorageKey('submittedDates');
            const savedDates = localStorage.getItem(storageKey);
            if (savedDates) {
                submittedDates = JSON.parse(savedDates);
                return;
            }

            const legacyDates = JSON.parse(localStorage.getItem('dukopsSubmittedDates') || '[]');
            submittedDates = legacyDates.filter(entry => entry && entry.desa === selectedDesa);
            if (submittedDates.length) {
                localStorage.setItem(storageKey, JSON.stringify(submittedDates));
            }
        }

        function resetCanvas() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.style.display = "none";
            canvas.width = 800;
            canvas.height = Math.round(canvas.width / (16/9));
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function resetAll() {
            submissionCount = 0;
            localStorage.setItem(getAccountStorageKey('submissionCount'), '0');
            
            localStorage.removeItem(getAccountStorageKey('sendLogs'));
            const logsContainer = document.getElementById('logTerkirim');
            if (logsContainer) logsContainer.innerHTML = '';
            
            submittedDates = [];
            localStorage.removeItem(getAccountStorageKey('submittedDates'));

            successfulUploadsByDate = {};
            successfulUploadTotal = 0;
            successfulSequence = 0;
            localStorage.removeItem(getAccountStorageKey('successfulUploadsByDate'));
            localStorage.removeItem(getAccountStorageKey('successfulUploadTotal'));
            localStorage.removeItem(getAccountStorageKey('successfulSequence'));
            renderSuccessfulUploadCounter();
            
            resetForm();
            
            showNotification("Ã¢Å“â€¦ Data berhasil direset", "success");
        }

        // ================= EVENT LISTENERS =================
        
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && chatConnectionActive) {
                updateChatStatus('connected');
            }
        });

        window.addEventListener("online", updateAppConnectionStatus);
        window.addEventListener("offline", updateAppConnectionStatus);
        updateAppConnectionStatus();
        
        window.addEventListener('beforeunload', function() {
            chatConnectionActive = false;
            saveChatHistory();
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }

        let deferredInstallPrompt = null;
        let installPromptChecked = false;
        const PWA_INSTALLED_KEY = "dukopsPwaInstalled";

        function isPwaInstalled() {
            const runningStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true ||
                document.referrer.startsWith('android-app://');
            if (runningStandalone) return true;
            try {
                return localStorage.getItem(PWA_INSTALLED_KEY) === "true";
            } catch (error) {
                console.warn("Status instalasi tidak dapat dibaca:", error);
                return false;
            }
        }

        function updateInstallButton() {
            const button = document.getElementById('installPwaButton');
            const villageSelect = document.getElementById('selectDesa');
            if (!button || !villageSelect) return;
            const canChooseVillage = isPwaInstalled();
            const shouldOfferInstall = Boolean(selectedDesa) &&
                !canChooseVillage &&
                (!installPromptChecked || Boolean(deferredInstallPrompt));
            button.classList.toggle('visible', shouldOfferInstall);
            villageSelect.hidden = false;
        }

        function rememberPwaInstallation() {
            try {
                localStorage.setItem(PWA_INSTALLED_KEY, "true");
            } catch (error) {
                console.warn("Status instalasi tidak dapat disimpan:", error);
            }
            updateInstallButton();
        }

        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            deferredInstallPrompt = event;
            installPromptChecked = true;
            try {
                localStorage.removeItem(PWA_INSTALLED_KEY);
            } catch (error) {
                console.warn("Status instalasi tidak dapat diperbarui:", error);
            }
            updateInstallButton();
        });

        window.addEventListener('appinstalled', () => {
            deferredInstallPrompt = null;
            installPromptChecked = true;
            rememberPwaInstallation();
        });

        const standaloneDisplayMode = window.matchMedia('(display-mode: standalone)');
        if (typeof standaloneDisplayMode.addEventListener === 'function') {
            standaloneDisplayMode.addEventListener('change', updateInstallButton);
        } else if (typeof standaloneDisplayMode.addListener === 'function') {
            standaloneDisplayMode.addListener(updateInstallButton);
        }
        updateInstallButton();
        window.setTimeout(() => {
            installPromptChecked = true;
            updateInstallButton();
        }, 2500);

        document.getElementById('installPwaButton').addEventListener('click', async () => {
            if (isPwaInstalled()) {
                updateInstallButton();
                return;
            }
            if (!deferredInstallPrompt) {
                return;
            }

            const promptEvent = deferredInstallPrompt;
            deferredInstallPrompt = null;
            try {
                await promptEvent.prompt();
                const choice = await promptEvent.userChoice;
                if (choice.outcome === "accepted") {
                    rememberPwaInstallation();
                } else {
                    installPromptChecked = true;
                    updateInstallButton();
                }
            } catch (error) {
                console.error('Prompt instalasi gagal:', error);
                installPromptChecked = true;
                updateInstallButton();
            } finally {
                updateInstallButton();
            }
        });

        if (window.location.protocol !== 'file:' && 'serviceWorker' in navigator) {
            let reloadedForUpdate = false;
            window.addEventListener('load', () => {
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (reloadedForUpdate) return;
                    reloadedForUpdate = true;
                    window.location.reload();
                });

                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(registration => {
                    registration.update();

                    registration.addEventListener('updatefound', () => {
                        const worker = registration.installing;
                        if (!worker) return;
                        worker.addEventListener('statechange', () => {
                            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                                worker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });

                    setInterval(() => registration.update(), 60 * 60 * 1000);
                }).catch(error => {
                    console.error('Service worker gagal didaftarkan:', error);
                });
            });
        }

        function updateSelectedDesaMarquee() {
            const label = document.getElementById('selectedDesaLabel');
            if (!label) return;
            label.classList.remove('marquee-active');
            label.style.removeProperty('--marquee-distance');
            if (label.scrollWidth <= label.clientWidth) return;
            label.style.setProperty('--marquee-distance', `${label.clientWidth - label.scrollWidth}px`);
            label.classList.add('marquee-active');
        }

        const selectedDesaLabel = document.getElementById('selectedDesaLabel');
        if (selectedDesaLabel) {
            new MutationObserver(updateSelectedDesaMarquee).observe(selectedDesaLabel, {
                childList: true,
                characterData: true,
                subtree: true
            });
            new ResizeObserver(updateSelectedDesaMarquee).observe(selectedDesaLabel.parentElement);
            updateSelectedDesaMarquee();
        }
    </script>
</body>
</html>
